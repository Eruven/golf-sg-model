[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "golfsg"
version = "0.1.0"
description = "Scratch-calibrated, course-specific strokes gained with a dispersion-based tee model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
xlsx = ["openpyxl"]

[tool.setuptools.packages.find]
include = ["golfsg*"]
